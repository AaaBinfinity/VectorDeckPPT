<text data-role="label" x="126" y="318" font-family="Arial" font-size="10" font-weight="700" fill="#0A0A0A" text-anchor="middle"><tspan x="126" dy="0">UNDERLYING DRIVER</tspan></text>
<text data-role="body" x="126" y="382" font-family="Arial" font-size="9" font-weight="400" fill="#534C44" text-anchor="middle"><tspan x="126" dy="0">Show the mechanism, constraint,</tspan><tspan x="126" dy="11.7">or repeated handoff failure.</tspan></text>
