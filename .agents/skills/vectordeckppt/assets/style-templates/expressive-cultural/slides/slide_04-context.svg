<text data-role="slide-title" x="34" y="82" font-family="Impact, Arial Black, Arial, sans-serif" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="start"><tspan x="34" dy="0">Three cultural tensions converge on one</tspan><tspan x="34" dy="27.3">participation moment</tspan></text>
<text data-role="caption" x="34" y="136" font-family="Arial" font-size="9" font-weight="400" fill="#534C44" text-anchor="start"><tspan x="34" dy="0">Separate the observed signal, the mechanism beneath it, and the lever the audience can influence.</tspan></text>
