<text data-role="label" x="638" y="252" font-family="Arial" font-size="10" font-weight="700" fill="#0A0A0A" text-anchor="middle"><tspan x="638" dy="0">DECISION LEVER</tspan></text>
<text data-role="body" x="638" y="316" font-family="Arial" font-size="9" font-weight="400" fill="#534C44" text-anchor="middle"><tspan x="638" dy="0">State the choice, owner, boundary,</tspan><tspan x="638" dy="11.7">and next proof point.</tspan></text>
