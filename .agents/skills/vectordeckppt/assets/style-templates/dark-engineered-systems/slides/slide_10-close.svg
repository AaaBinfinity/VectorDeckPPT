<text data-role="deck-title" x="54" y="142" font-family="Arial" font-size="46" font-weight="700" fill="#E8F1FA" text-anchor="start"><tspan x="54" dy="0">End with one clear move</tspan></text>
<text data-role="subheading" x="58" y="194" font-family="Arial" font-size="14" font-weight="700" fill="#E8F1FA" text-anchor="start"><tspan x="58" dy="0">Resolve the argument into an owner, a milestone, and a visible next decision.</tspan></text>
<line x1="58" y1="222" x2="704" y2="222" stroke="#304259" stroke-width="2"/>
<text data-role="metric" x="58" y="274" font-family="Arial" font-size="24" font-weight="700" fill="#20C4E8" text-anchor="start"><tspan x="58" dy="0">01</tspan></text>
<text data-role="subheading" x="58" y="308" font-family="Arial" font-size="14" font-weight="700" fill="#E8F1FA" text-anchor="start"><tspan x="58" dy="0">DECISION</tspan></text>
<text data-role="body" x="58" y="334" font-family="Arial" font-size="9" font-weight="400" fill="#8EA1B6" text-anchor="start"><tspan x="58" dy="0">Name what must be approved</tspan></text>
<text data-role="metric" x="274" y="274" font-family="Arial" font-size="24" font-weight="700" fill="#5077FF" text-anchor="start"><tspan x="274" dy="0">02</tspan></text>
