<text data-role="body" x="274" y="334" font-family="Arial" font-size="9" font-weight="400" fill="#8EA1B6" text-anchor="start"><tspan x="274" dy="0">Make accountability visible</tspan></text>
<text data-role="metric" x="490" y="274" font-family="Arial" font-size="24" font-weight="700" fill="#5077FF" text-anchor="start"><tspan x="490" dy="0">03</tspan></text>
