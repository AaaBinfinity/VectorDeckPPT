<text data-role="subheading" x="488" y="170" font-family="Arial" font-size="14" font-weight="700" fill="#20C4E8" text-anchor="start"><tspan x="488" dy="0">01  SCENE</tspan></text>
<text data-role="body" x="488" y="194" font-family="Arial" font-size="9" font-weight="400" fill="#E8F1FA" text-anchor="start"><tspan x="488" dy="0">Show where the issue becomes visible, who experiences it,</tspan><tspan x="488" dy="12.15">and what is at stake in that specific setting.</tspan></text>
<text data-role="subheading" x="488" y="246" font-family="Arial" font-size="14" font-weight="700" fill="#20C4E8" text-anchor="start"><tspan x="488" dy="0">02  DETAIL</tspan></text>
<text data-role="body" x="488" y="270" font-family="Arial" font-size="9" font-weight="400" fill="#E8F1FA" text-anchor="start"><tspan x="488" dy="0">Annotate an observation, quotation, artifact, or mechanism;</tspan><tspan x="488" dy="12.15">name the source and the limit of the evidence.</tspan></text>
<text data-role="subheading" x="488" y="322" font-family="Arial" font-size="14" font-weight="700" fill="#20C4E8" text-anchor="start"><tspan x="488" dy="0">03  MEANING</tspan></text>
<text data-role="body" x="488" y="346" font-family="Arial" font-size="9" font-weight="400" fill="#E8F1FA" text-anchor="start"><tspan x="488" dy="0">State what the evidence changes, which choice it supports,</tspan><tspan x="488" dy="12.15">and what the audience should inspect next.</tspan></text>
