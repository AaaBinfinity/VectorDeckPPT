<text data-role="slide-title" x="34" y="82" font-family="Arial" font-size="26" font-weight="700" fill="#E8F1FA" text-anchor="start"><tspan x="34" dy="0">One story becomes credible through three kinds of proof</tspan></text>
<text data-role="caption" x="34" y="110" font-family="Arial" font-size="9" font-weight="400" fill="#8EA1B6" text-anchor="start"><tspan x="34" dy="0">Combine a concrete scene, an observed detail, and an explicit implication.</tspan></text>
