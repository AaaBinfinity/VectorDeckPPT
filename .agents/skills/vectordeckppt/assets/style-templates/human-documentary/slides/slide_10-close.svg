<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>HUMAN DOCUMENTARY close template</title>
<desc>One editable 16:9 close reference page from the HUMAN DOCUMENTARY multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#D8CEBD" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="8" fill="#FAF4E9" stroke="#BEB09A" stroke-width="1"/>
<circle cx="642" cy="96" r="54" fill="#C28B47" opacity="0.18"/>
<polygon points="0,400 0,320 154,240 316,332 466,252 630,332 760,282 760,400" fill="#55705B" opacity="0.11"/>
<line x1="38" y1="356" x2="320" y2="356" stroke="#B76038" stroke-width="4"/>
<line x1="332" y1="356" x2="430" y2="356" stroke="#BEB09A" stroke-width="4"/>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#B76038" text-anchor="start"><tspan x="34" dy="0">RESOLUTION / NEXT MOVE</tspan></text>
<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#6B655B" text-anchor="end"><tspan x="718" dy="0">10</tspan></text>
<text data-role="deck-title" x="54" y="158" font-family="Georgia" font-size="42" font-weight="700" fill="#273129" text-anchor="start"><tspan x="54" dy="0">Return the story as action</tspan></text>
<text data-role="subheading" x="58" y="220" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="58" dy="0">Close the loop with the people, places, evidence, and commitments</tspan><tspan x="58" dy="18.2">that shaped it.</tspan></text>
<line x1="58" y1="258" x2="704" y2="258" stroke="#B76038" stroke-width="2"/>
<text data-role="metric" x="58" y="298" font-family="Georgia" font-size="24" font-weight="700" fill="#B76038" text-anchor="start"><tspan x="58" dy="0">01</tspan></text>
<text data-role="subheading" x="58" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="58" dy="0">COMMITMENT</tspan></text>
<text data-role="body" x="58" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#6B655B" text-anchor="start"><tspan x="58" dy="0">What returns to the field</tspan></text>
<line x1="58" y1="372" x2="236" y2="372" stroke="#BEB09A" stroke-width="1"/>
<text data-role="metric" x="274" y="298" font-family="Georgia" font-size="24" font-weight="700" fill="#55705B" text-anchor="start"><tspan x="274" dy="0">02</tspan></text>
<text data-role="subheading" x="274" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="274" dy="0">STEWARD</tspan></text>
<text data-role="body" x="274" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#6B655B" text-anchor="start"><tspan x="274" dy="0">Who protects the promise</tspan></text>
<line x1="274" y1="372" x2="452" y2="372" stroke="#BEB09A" stroke-width="1"/>
<text data-role="metric" x="490" y="298" font-family="Georgia" font-size="24" font-weight="700" fill="#55705B" text-anchor="start"><tspan x="490" dy="0">03</tspan></text>
<text data-role="subheading" x="490" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="490" dy="0">RETURN</tspan></text>
<text data-role="body" x="490" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#6B655B" text-anchor="start"><tspan x="490" dy="0">When people see the result</tspan></text>
<line x1="490" y1="372" x2="668" y2="372" stroke="#BEB09A" stroke-width="1"/>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#6B655B" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
