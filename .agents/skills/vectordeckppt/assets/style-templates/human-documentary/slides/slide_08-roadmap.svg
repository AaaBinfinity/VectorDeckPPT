<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>HUMAN DOCUMENTARY roadmap template</title>
<desc>One editable 16:9 roadmap reference page from the HUMAN DOCUMENTARY multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#D8CEBD" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="8" fill="#FAF4E9" stroke="#BEB09A" stroke-width="1"/>
<circle cx="642" cy="96" r="54" fill="#C28B47" opacity="0.18"/>
<polygon points="0,400 0,320 154,240 316,332 466,252 630,332 760,282 760,400" fill="#55705B" opacity="0.11"/>
<line x1="38" y1="356" x2="320" y2="356" stroke="#B76038" stroke-width="4"/>
<line x1="332" y1="356" x2="430" y2="356" stroke="#BEB09A" stroke-width="4"/>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#B76038" text-anchor="start"><tspan x="34" dy="0">ROADMAP / OWNERSHIP</tspan></text>
<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#6B655B" text-anchor="end"><tspan x="718" dy="0">08</tspan></text>
<text data-role="slide-title" x="34" y="82" font-family="Georgia" font-size="26" font-weight="700" fill="#273129" text-anchor="start"><tspan x="34" dy="0">Return evidence to the field at every milestone</tspan></text>
<text data-role="caption" x="34" y="110" font-family="Arial" font-size="9" font-weight="400" fill="#6B655B" text-anchor="start"><tspan x="34" dy="0">Each phase ends with a reviewable artifact, a named owner, an acceptance condition, and a decision.</tspan></text>
<polyline points="108,196 280,272 452,196 624,272" fill="none" stroke="#BEB09A" stroke-width="5"/>
<circle cx="108" cy="196" r="34" fill="#B76038" stroke="#B76038" stroke-width="3"/>
<text data-role="metric" x="108" y="203" font-family="Georgia" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="108" dy="0">01</tspan></text>
<text data-role="subheading" x="68" y="254" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="68" dy="0">FRAME</tspan></text>
<text data-role="body" x="68" y="278" font-family="Arial" font-size="9" font-weight="400" fill="#273129" text-anchor="start"><tspan x="68" dy="0">Decision + baseline</tspan></text>
<text data-role="annotation" x="68" y="300" font-family="Arial" font-size="9" font-weight="700" fill="#55705B" text-anchor="start"><tspan x="68" dy="0">OWNER A · W1</tspan></text>
<circle cx="280" cy="272" r="34" fill="#EFE3D1" stroke="#B76038" stroke-width="3"/>
<text data-role="metric" x="280" y="279" font-family="Georgia" font-size="16" font-weight="700" fill="#B76038" text-anchor="middle"><tspan x="280" dy="0">02</tspan></text>
<text data-role="subheading" x="240" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="240" dy="0">PROVE</tspan></text>
<text data-role="body" x="240" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#273129" text-anchor="start"><tspan x="240" dy="0">Critical mechanism</tspan></text>
<text data-role="annotation" x="240" y="376" font-family="Arial" font-size="9" font-weight="700" fill="#55705B" text-anchor="start"><tspan x="240" dy="0">OWNER B · W2–3</tspan></text>
<circle cx="452" cy="196" r="34" fill="#EFE3D1" stroke="#B76038" stroke-width="3"/>
<text data-role="metric" x="452" y="203" font-family="Georgia" font-size="16" font-weight="700" fill="#B76038" text-anchor="middle"><tspan x="452" dy="0">03</tspan></text>
<text data-role="subheading" x="412" y="254" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="412" dy="0">ENABLE</tspan></text>
<text data-role="body" x="412" y="278" font-family="Arial" font-size="9" font-weight="400" fill="#273129" text-anchor="start"><tspan x="412" dy="0">Workflow + criteria</tspan></text>
<text data-role="annotation" x="412" y="300" font-family="Arial" font-size="9" font-weight="700" fill="#55705B" text-anchor="start"><tspan x="412" dy="0">OWNER C · W4</tspan></text>
<circle cx="624" cy="272" r="34" fill="#EFE3D1" stroke="#B76038" stroke-width="3"/>
<text data-role="metric" x="624" y="279" font-family="Georgia" font-size="16" font-weight="700" fill="#B76038" text-anchor="middle"><tspan x="624" dy="0">04</tspan></text>
<text data-role="subheading" x="584" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="584" dy="0">SCALE</tspan></text>
<text data-role="body" x="584" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#273129" text-anchor="start"><tspan x="584" dy="0">Value + quality hold</tspan></text>
<text data-role="annotation" x="584" y="376" font-family="Arial" font-size="9" font-weight="700" fill="#55705B" text-anchor="start"><tspan x="584" dy="0">OWNER D · Q+1</tspan></text>
<rect x="34" y="364" width="682" height="24" rx="12" fill="#B76038" stroke="none" stroke-width="0"/>
<text data-role="source" x="375" y="381" font-family="Arial" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="375" dy="0">ARTIFACT · OWNER · ACCEPTANCE · DECISION · NEXT DEPENDENCY</tspan></text>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#6B655B" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
</g>
</svg>
