<text data-role="slide-title" x="34" y="82" font-family="Georgia" font-size="26" font-weight="700" fill="#273129" text-anchor="start"><tspan x="34" dy="0">Listen first: lived detail changes the decision</tspan></text>
<text data-role="caption" x="34" y="110" font-family="Arial" font-size="9" font-weight="400" fill="#6B655B" text-anchor="start"><tspan x="34" dy="0">Connect a concrete scene, a sourced detail, an interpretation, and the decision it changes.</tspan></text>
