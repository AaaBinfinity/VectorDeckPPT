<text data-role="slide-title" x="34" y="82" font-family="Georgia" font-size="26" font-weight="700" fill="#273129" text-anchor="start"><tspan x="34" dy="0">Five field moves protect voice, evidence, and</tspan><tspan x="34" dy="27.3">action</tspan></text>
<text data-role="caption" x="34" y="136" font-family="Arial" font-size="9" font-weight="400" fill="#6B655B" text-anchor="start"><tspan x="34" dy="0">Every stage produces an artifact, a named owner, and a visible acceptance condition.</tspan></text>
