<text data-role="body" x="52" y="266" font-family="Arial" font-size="9" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="52" dy="0">Define the decision</tspan><tspan x="52" dy="11.88">and success signal</tspan></text>
<text data-role="annotation" x="52" y="302" font-family="Arial" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="52" dy="0">OUTPUT 01</tspan></text>
