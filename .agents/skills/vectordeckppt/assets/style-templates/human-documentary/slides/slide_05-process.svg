<text data-role="label" x="64" y="369" font-family="Arial" font-size="10" font-weight="700" fill="#B76038" text-anchor="start"><tspan x="64" dy="0">QUALITY GATE</tspan></text>
<text data-role="source" x="190" y="366" font-family="Arial" font-size="9" font-weight="400" fill="#273129" text-anchor="start"><tspan x="190" dy="0">Evidence, owner, and acceptance condition must all be explicit before the next stage.</tspan></text>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#6B655B" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
