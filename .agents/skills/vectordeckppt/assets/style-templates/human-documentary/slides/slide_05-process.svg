<text data-role="metric" x="604" y="222" font-family="Georgia" font-size="22" font-weight="700" fill="#B76038" text-anchor="start"><tspan x="604" dy="0">05</tspan></text>
<text data-role="subheading" x="604" y="254" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="604" dy="0">Act</tspan></text>
<text data-role="body" x="604" y="278" font-family="Arial" font-size="9" font-weight="400" fill="#6B655B" text-anchor="start"><tspan x="604" dy="0">Assign the next</tspan><tspan x="604" dy="11.88">move, owner, and timing</tspan></text>
<text data-role="annotation" x="604" y="314" font-family="Arial" font-size="9" font-weight="700" fill="#55705B" text-anchor="start"><tspan x="604" dy="0">OUTPUT 05</tspan></text>
