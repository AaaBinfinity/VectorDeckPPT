<text data-role="subheading" x="190" y="222" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="190" dy="0">Read</tspan></text>
<text data-role="body" x="190" y="246" font-family="Arial" font-size="9" font-weight="400" fill="#6B655B" text-anchor="start"><tspan x="190" dy="0">Extract facts,</tspan><tspan x="190" dy="11.88">constraints, and tensions</tspan></text>
<text data-role="annotation" x="190" y="282" font-family="Arial" font-size="9" font-weight="700" fill="#55705B" text-anchor="start"><tspan x="190" dy="0">OUTPUT 02</tspan></text>
