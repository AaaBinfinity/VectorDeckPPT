<text data-role="subheading" x="466" y="228" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="466" dy="0">Verify</tspan></text>
<text data-role="body" x="466" y="252" font-family="Arial" font-size="9" font-weight="400" fill="#6B655B" text-anchor="start"><tspan x="466" dy="0">Review fidelity,</tspan><tspan x="466" dy="11.88">meaning, and exceptions</tspan></text>
<text data-role="annotation" x="466" y="288" font-family="Arial" font-size="9" font-weight="700" fill="#55705B" text-anchor="start"><tspan x="466" dy="0">OUTPUT 04</tspan></text>
