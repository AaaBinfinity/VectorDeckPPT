<text data-role="subheading" x="328" y="248" font-family="Arial" font-size="14" font-weight="700" fill="#273129" text-anchor="start"><tspan x="328" dy="0">Design</tspan></text>
<text data-role="body" x="328" y="272" font-family="Arial" font-size="9" font-weight="400" fill="#6B655B" text-anchor="start"><tspan x="328" dy="0">Map evidence to the</tspan><tspan x="328" dy="11.88">clearest visual form</tspan></text>
<text data-role="annotation" x="328" y="308" font-family="Arial" font-size="9" font-weight="700" fill="#55705B" text-anchor="start"><tspan x="328" dy="0">OUTPUT 03</tspan></text>
