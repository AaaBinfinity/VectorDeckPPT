<text data-role="subheading" x="468" y="158" font-family="Arial" font-size="14" font-weight="700" fill="#087F73" text-anchor="start"><tspan x="468" dy="0">01  SCENE</tspan></text>
<text data-role="body" x="468" y="182" font-family="Arial" font-size="9" font-weight="400" fill="#102C2A" text-anchor="start"><tspan x="468" dy="0">Who experiences the issue,</tspan><tspan x="468" dy="12.15">where it occurs, and what is at stake.</tspan></text>
<text data-role="subheading" x="468" y="236" font-family="Arial" font-size="14" font-weight="700" fill="#087F73" text-anchor="start"><tspan x="468" dy="0">02  SOURCE</tspan></text>
<text data-role="body" x="468" y="260" font-family="Arial" font-size="9" font-weight="400" fill="#102C2A" text-anchor="start"><tspan x="468" dy="0">Name the observation, artifact,</tspan><tspan x="468" dy="12.15">quotation, date, and evidence limit.</tspan></text>
<text data-role="subheading" x="468" y="314" font-family="Arial" font-size="14" font-weight="700" fill="#087F73" text-anchor="start"><tspan x="468" dy="0">03  MEANING</tspan></text>
<text data-role="body" x="468" y="338" font-family="Arial" font-size="9" font-weight="400" fill="#102C2A" text-anchor="start"><tspan x="468" dy="0">State what changes now, who decides,</tspan><tspan x="468" dy="12.15">and which proof the audience should inspect.</tspan></text>
