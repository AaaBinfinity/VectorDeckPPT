<text data-role="slide-title" x="34" y="82" font-family="Aptos Display, Arial, sans-serif" font-size="26" font-weight="700" fill="#102C2A" text-anchor="start"><tspan x="34" dy="0">Three drivers explain the headline movement</tspan></text>
