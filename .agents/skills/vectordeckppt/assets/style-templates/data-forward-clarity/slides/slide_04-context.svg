<text data-role="body" x="638" y="316" font-family="Arial" font-size="9" font-weight="400" fill="#58716E" text-anchor="middle"><tspan x="638" dy="0">State the choice, owner, boundary,</tspan><tspan x="638" dy="11.7">and next proof point.</tspan></text>
