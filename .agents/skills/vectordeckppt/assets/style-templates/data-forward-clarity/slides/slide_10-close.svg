<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>DATA-FORWARD CLARITY close template</title>
<desc>One editable 16:9 close reference page from the DATA-FORWARD CLARITY multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#DFE7E5" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="10" fill="#F9FBFA" stroke="#B9CCCA" stroke-width="1"/>
<rect x="0" y="0" width="760" height="6" rx="10" fill="#087F73" stroke="none" stroke-width="0"/>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#087F73" text-anchor="start"><tspan x="34" dy="0">RESOLUTION</tspan></text>
<text data-role="page-number" x="714" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#58716E" text-anchor="end"><tspan x="714" dy="0">10</tspan></text>
<text data-role="deck-title" x="54" y="142" font-family="Arial" font-size="46" font-weight="700" fill="#102C2A" text-anchor="start"><tspan x="54" dy="0">End with one clear move</tspan></text>
<text data-role="subheading" x="58" y="194" font-family="Arial" font-size="14" font-weight="700" fill="#102C2A" text-anchor="start"><tspan x="58" dy="0">Resolve the argument into an owner, a milestone, and a visible next decision.</tspan></text>
<line x1="58" y1="222" x2="704" y2="222" stroke="#B9CCCA" stroke-width="2"/>
<text data-role="metric" x="58" y="274" font-family="Arial" font-size="24" font-weight="700" fill="#087F73" text-anchor="start"><tspan x="58" dy="0">01</tspan></text>
<text data-role="subheading" x="58" y="308" font-family="Arial" font-size="14" font-weight="700" fill="#102C2A" text-anchor="start"><tspan x="58" dy="0">DECISION</tspan></text>
<text data-role="body" x="58" y="334" font-family="Arial" font-size="9" font-weight="400" fill="#58716E" text-anchor="start"><tspan x="58" dy="0">Name what must be approved</tspan></text>
<text data-role="metric" x="274" y="274" font-family="Arial" font-size="24" font-weight="700" fill="#2D62CC" text-anchor="start"><tspan x="274" dy="0">02</tspan></text>
<text data-role="subheading" x="274" y="308" font-family="Arial" font-size="14" font-weight="700" fill="#102C2A" text-anchor="start"><tspan x="274" dy="0">OWNER</tspan></text>
<text data-role="body" x="274" y="334" font-family="Arial" font-size="9" font-weight="400" fill="#58716E" text-anchor="start"><tspan x="274" dy="0">Make accountability visible</tspan></text>
<text data-role="metric" x="490" y="274" font-family="Arial" font-size="24" font-weight="700" fill="#2D62CC" text-anchor="start"><tspan x="490" dy="0">03</tspan></text>
<text data-role="subheading" x="490" y="308" font-family="Arial" font-size="14" font-weight="700" fill="#102C2A" text-anchor="start"><tspan x="490" dy="0">MILESTONE</tspan></text>
<text data-role="body" x="490" y="334" font-family="Arial" font-size="9" font-weight="400" fill="#58716E" text-anchor="start"><tspan x="490" dy="0">Define the next proof point</tspan></text>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#58716E" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
</g>
</svg>
