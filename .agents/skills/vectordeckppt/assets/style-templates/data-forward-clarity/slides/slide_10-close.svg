<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>DATA-FORWARD CLARITY close template</title>
<desc>One editable 16:9 close reference page from the DATA-FORWARD CLARITY multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#DFE7E5" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="10" fill="#F9FBFA" stroke="#B9CCCA" stroke-width="1"/>
<line x1="54" y1="126" x2="54" y2="370" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="130" y1="126" x2="130" y2="370" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="206" y1="126" x2="206" y2="370" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="282" y1="126" x2="282" y2="370" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="358" y1="126" x2="358" y2="370" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="434" y1="126" x2="434" y2="370" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="510" y1="126" x2="510" y2="370" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="586" y1="126" x2="586" y2="370" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="662" y1="126" x2="662" y2="370" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="32" y1="146" x2="730" y2="146" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="32" y1="191" x2="730" y2="191" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="32" y1="236" x2="730" y2="236" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="32" y1="281" x2="730" y2="281" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="32" y1="326" x2="730" y2="326" stroke="#B9CCCA" stroke-width="0.6"/>
<line x1="32" y1="371" x2="730" y2="371" stroke="#B9CCCA" stroke-width="0.6"/>
<rect x="718" y="54" width="12" height="314" rx="6" fill="#087F73" stroke="none" stroke-width="0"/>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#087F73" text-anchor="start"><tspan x="34" dy="0">RESOLUTION / NEXT MOVE</tspan></text>
<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#58716E" text-anchor="end"><tspan x="718" dy="0">10</tspan></text>
<text data-role="deck-title" x="54" y="126" font-family="Aptos Display, Arial, sans-serif" font-size="42" font-weight="700" fill="#102C2A" text-anchor="start"><tspan x="54" dy="0">Turn the signal into an</tspan><tspan x="54" dy="42.84">operating choice</tspan></text>
<text data-role="subheading" x="58" y="220" font-family="Arial" font-size="14" font-weight="700" fill="#102C2A" text-anchor="start"><tspan x="58" dy="0">Protect the metric definition, assign the owner, and schedule the</tspan><tspan x="58" dy="18.2">next check.</tspan></text>
<line x1="58" y1="258" x2="704" y2="258" stroke="#087F73" stroke-width="2"/>
<text data-role="metric" x="58" y="298" font-family="Aptos Display, Arial, sans-serif" font-size="24" font-weight="700" fill="#087F73" text-anchor="start"><tspan x="58" dy="0">01</tspan></text>
<text data-role="subheading" x="58" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#102C2A" text-anchor="start"><tspan x="58" dy="0">METRIC</tspan></text>
<text data-role="body" x="58" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#58716E" text-anchor="start"><tspan x="58" dy="0">What signal stays stable</tspan></text>
<line x1="58" y1="372" x2="236" y2="372" stroke="#B9CCCA" stroke-width="1"/>
<text data-role="metric" x="274" y="298" font-family="Aptos Display, Arial, sans-serif" font-size="24" font-weight="700" fill="#2D62CC" text-anchor="start"><tspan x="274" dy="0">02</tspan></text>
<text data-role="subheading" x="274" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#102C2A" text-anchor="start"><tspan x="274" dy="0">OWNER</tspan></text>
<text data-role="body" x="274" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#58716E" text-anchor="start"><tspan x="274" dy="0">Who watches the driver</tspan></text>
<line x1="274" y1="372" x2="452" y2="372" stroke="#B9CCCA" stroke-width="1"/>
<text data-role="metric" x="490" y="298" font-family="Aptos Display, Arial, sans-serif" font-size="24" font-weight="700" fill="#2D62CC" text-anchor="start"><tspan x="490" dy="0">03</tspan></text>
<text data-role="subheading" x="490" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#102C2A" text-anchor="start"><tspan x="490" dy="0">NEXT CHECK</tspan></text>
<text data-role="body" x="490" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#58716E" text-anchor="start"><tspan x="490" dy="0">When the claim is reviewed</tspan></text>
<line x1="490" y1="372" x2="668" y2="372" stroke="#B9CCCA" stroke-width="1"/>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#58716E" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
</g>
</svg>
