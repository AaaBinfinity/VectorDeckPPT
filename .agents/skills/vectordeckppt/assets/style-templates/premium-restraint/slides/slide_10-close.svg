<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>PREMIUM RESTRAINT close template</title>
<desc>One editable 16:9 close reference page from the PREMIUM RESTRAINT multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#151813" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="2" fill="#20231D" stroke="#55594D" stroke-width="1"/>
<circle cx="650" cy="206" r="142" fill="none" stroke="#C7A35A" stroke-width="1" opacity="0.35"/>
<circle cx="650" cy="206" r="102" fill="none" stroke="#8E9B78" stroke-width="1" opacity="0.28"/>
<line x1="42" y1="356" x2="706" y2="356" stroke="#C7A35A" stroke-width="1.5"/>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#C7A35A" text-anchor="start"><tspan x="34" dy="0">RESOLUTION / NEXT MOVE</tspan></text>
<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#B8B2A5" text-anchor="end"><tspan x="718" dy="0">10</tspan></text>
<text data-role="deck-title" x="54" y="126" font-family="Georgia" font-size="42" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="54" dy="0">Choose fewer moves.</tspan><tspan x="54" dy="42.84">Compound the proof.</tspan></text>
<text data-role="subheading" x="58" y="220" font-family="Arial" font-size="14" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="58" dy="0">Concentrate capital, sequence leadership attention, and keep the</tspan><tspan x="58" dy="18.2">review cadence visible.</tspan></text>
<line x1="58" y1="258" x2="704" y2="258" stroke="#C7A35A" stroke-width="2"/>
<text data-role="metric" x="58" y="298" font-family="Georgia" font-size="24" font-weight="700" fill="#C7A35A" text-anchor="start"><tspan x="58" dy="0">01</tspan></text>
<text data-role="subheading" x="58" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="58" dy="0">BET</tspan></text>
<text data-role="body" x="58" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#B8B2A5" text-anchor="start"><tspan x="58" dy="0">What receives focus</tspan></text>
<line x1="58" y1="372" x2="236" y2="372" stroke="#55594D" stroke-width="1"/>
<text data-role="metric" x="274" y="298" font-family="Georgia" font-size="24" font-weight="700" fill="#8E9B78" text-anchor="start"><tspan x="274" dy="0">02</tspan></text>
<text data-role="subheading" x="274" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="274" dy="0">SPONSOR</tspan></text>
<text data-role="body" x="274" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#B8B2A5" text-anchor="start"><tspan x="274" dy="0">Who protects the sequence</tspan></text>
<line x1="274" y1="372" x2="452" y2="372" stroke="#55594D" stroke-width="1"/>
<text data-role="metric" x="490" y="298" font-family="Georgia" font-size="24" font-weight="700" fill="#8E9B78" text-anchor="start"><tspan x="490" dy="0">03</tspan></text>
<text data-role="subheading" x="490" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="490" dy="0">REVIEW</tspan></text>
<text data-role="body" x="490" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#B8B2A5" text-anchor="start"><tspan x="490" dy="0">What unlocks more capital</tspan></text>
<line x1="490" y1="372" x2="668" y2="372" stroke="#55594D" stroke-width="1"/>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#B8B2A5" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
</g>
</svg>
