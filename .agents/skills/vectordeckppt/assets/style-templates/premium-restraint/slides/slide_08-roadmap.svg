<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>PREMIUM RESTRAINT roadmap template</title>
<desc>One editable 16:9 roadmap reference page from the PREMIUM RESTRAINT multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#151813" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="2" fill="#20231D" stroke="#55594D" stroke-width="1"/>
<circle cx="650" cy="206" r="142" fill="none" stroke="#C7A35A" stroke-width="1" opacity="0.35"/>
<circle cx="650" cy="206" r="102" fill="none" stroke="#8E9B78" stroke-width="1" opacity="0.28"/>
<line x1="42" y1="356" x2="706" y2="356" stroke="#C7A35A" stroke-width="1.5"/>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#C7A35A" text-anchor="start"><tspan x="34" dy="0">ROADMAP / OWNERSHIP</tspan></text>
<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#B8B2A5" text-anchor="end"><tspan x="718" dy="0">08</tspan></text>
<text data-role="slide-title" x="34" y="82" font-family="Georgia" font-size="26" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="34" dy="0">Sequence only the bets that unlock the next proof</tspan></text>
<text data-role="caption" x="34" y="110" font-family="Arial" font-size="9" font-weight="400" fill="#B8B2A5" text-anchor="start"><tspan x="34" dy="0">Each phase ends with a reviewable artifact, a named owner, an acceptance condition, and a decision.</tspan></text>
<polyline points="108,196 280,272 452,196 624,272" fill="none" stroke="#55594D" stroke-width="5"/>
<circle cx="108" cy="196" r="34" fill="#C7A35A" stroke="#C7A35A" stroke-width="3"/>
