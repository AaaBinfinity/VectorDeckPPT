<text data-role="subheading" x="584" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="584" dy="0">SCALE</tspan></text>
<text data-role="body" x="584" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#F1EBDD" text-anchor="start"><tspan x="584" dy="0">Value + quality hold</tspan></text>
<text data-role="annotation" x="584" y="376" font-family="Arial" font-size="9" font-weight="700" fill="#8E9B78" text-anchor="start"><tspan x="584" dy="0">OWNER D · Q+1</tspan></text>
<rect x="34" y="364" width="682" height="24" rx="12" fill="#C7A35A" stroke="none" stroke-width="0"/>
<text data-role="source" x="375" y="381" font-family="Arial" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="375" dy="0">ARTIFACT · OWNER · ACCEPTANCE · DECISION · NEXT DEPENDENCY</tspan></text>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#B8B2A5" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
