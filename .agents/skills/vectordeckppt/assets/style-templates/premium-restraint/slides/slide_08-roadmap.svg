<text data-role="subheading" x="240" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="240" dy="0">PROVE</tspan></text>
<text data-role="body" x="240" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#F1EBDD" text-anchor="start"><tspan x="240" dy="0">Critical mechanism</tspan></text>
<text data-role="annotation" x="240" y="376" font-family="Arial" font-size="9" font-weight="700" fill="#8E9B78" text-anchor="start"><tspan x="240" dy="0">OWNER B · W2–3</tspan></text>
<circle cx="452" cy="196" r="34" fill="#292D25" stroke="#C7A35A" stroke-width="3"/>
<text data-role="metric" x="452" y="203" font-family="Georgia" font-size="16" font-weight="700" fill="#C7A35A" text-anchor="middle"><tspan x="452" dy="0">03</tspan></text>
<text data-role="subheading" x="412" y="254" font-family="Arial" font-size="14" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="412" dy="0">ENABLE</tspan></text>
<text data-role="body" x="412" y="278" font-family="Arial" font-size="9" font-weight="400" fill="#F1EBDD" text-anchor="start"><tspan x="412" dy="0">Workflow + criteria</tspan></text>
<text data-role="annotation" x="412" y="300" font-family="Arial" font-size="9" font-weight="700" fill="#8E9B78" text-anchor="start"><tspan x="412" dy="0">OWNER C · W4</tspan></text>
<circle cx="624" cy="272" r="34" fill="#292D25" stroke="#C7A35A" stroke-width="3"/>
