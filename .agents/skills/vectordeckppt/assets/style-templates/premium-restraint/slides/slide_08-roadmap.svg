<text data-role="subheading" x="68" y="254" font-family="Arial" font-size="14" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="68" dy="0">FRAME</tspan></text>
<text data-role="body" x="68" y="278" font-family="Arial" font-size="9" font-weight="400" fill="#F1EBDD" text-anchor="start"><tspan x="68" dy="0">Decision + baseline</tspan></text>
<text data-role="annotation" x="68" y="300" font-family="Arial" font-size="9" font-weight="700" fill="#8E9B78" text-anchor="start"><tspan x="68" dy="0">OWNER A · W1</tspan></text>
<circle cx="280" cy="272" r="34" fill="#292D25" stroke="#C7A35A" stroke-width="3"/>
