<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>PREMIUM RESTRAINT narrative template</title>
<desc>One editable 16:9 narrative reference page from the PREMIUM RESTRAINT multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#151813" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="2" fill="#20231D" stroke="#55594D" stroke-width="1"/>
<circle cx="650" cy="206" r="142" fill="none" stroke="#C7A35A" stroke-width="1" opacity="0.35"/>
<circle cx="650" cy="206" r="102" fill="none" stroke="#8E9B78" stroke-width="1" opacity="0.28"/>
<line x1="42" y1="356" x2="706" y2="356" stroke="#C7A35A" stroke-width="1.5"/>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#C7A35A" text-anchor="start"><tspan x="34" dy="0">NARRATIVE / ANNOTATION</tspan></text>
<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#B8B2A5" text-anchor="end"><tspan x="718" dy="0">03</tspan></text>
<text data-role="slide-title" x="34" y="82" font-family="Georgia" font-size="26" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="34" dy="0">One precise story can reframe the portfolio</tspan></text>
<text data-role="caption" x="34" y="110" font-family="Arial" font-size="9" font-weight="400" fill="#B8B2A5" text-anchor="start"><tspan x="34" dy="0">Connect a concrete scene, a sourced detail, an interpretation, and the decision it changes.</tspan></text>
<rect x="34" y="144" width="402" height="196" rx="2" fill="#292D25" stroke="#55594D" stroke-width="1"/>
<circle cx="228" cy="232" r="64" fill="none" stroke="#C7A35A" stroke-width="2"/>
<text data-role="metric" x="228" y="247" font-family="Georgia" font-size="46" font-weight="700" fill="#F1EBDD" text-anchor="middle"><tspan x="228" dy="0">01</tspan></text>
<line x1="82" y1="288" x2="374" y2="288" stroke="#C7A35A" stroke-width="1"/>
<text data-role="label" x="228" y="308" font-family="Arial" font-size="10" font-weight="700" fill="#B8B2A5" text-anchor="middle"><tspan x="228" dy="0">ONE PRECISE SIGNAL</tspan></text>
<text data-role="label" x="52" y="316" font-family="Arial" font-size="10" font-weight="700" fill="#F1EBDD" text-anchor="start"><tspan x="52" dy="0">FIELD NOTE / ORIGINAL PLACEHOLDER</tspan></text>
<text data-role="subheading" x="468" y="158" font-family="Arial" font-size="14" font-weight="700" fill="#C7A35A" text-anchor="start"><tspan x="468" dy="0">01  SCENE</tspan></text>
<text data-role="body" x="468" y="182" font-family="Arial" font-size="9" font-weight="400" fill="#F1EBDD" text-anchor="start"><tspan x="468" dy="0">Who experiences the issue,</tspan><tspan x="468" dy="12.15">where it occurs, and what is at stake.</tspan></text>
<text data-role="subheading" x="468" y="236" font-family="Arial" font-size="14" font-weight="700" fill="#C7A35A" text-anchor="start"><tspan x="468" dy="0">02  SOURCE</tspan></text>
<text data-role="body" x="468" y="260" font-family="Arial" font-size="9" font-weight="400" fill="#F1EBDD" text-anchor="start"><tspan x="468" dy="0">Name the observation, artifact,</tspan><tspan x="468" dy="12.15">quotation, date, and evidence limit.</tspan></text>
<text data-role="subheading" x="468" y="314" font-family="Arial" font-size="14" font-weight="700" fill="#C7A35A" text-anchor="start"><tspan x="468" dy="0">03  MEANING</tspan></text>
<text data-role="body" x="468" y="338" font-family="Arial" font-size="9" font-weight="400" fill="#F1EBDD" text-anchor="start"><tspan x="468" dy="0">State what changes now, who decides,</tspan><tspan x="468" dy="12.15">and which proof the audience should inspect.</tspan></text>
<line x1="468" y1="366" x2="716" y2="366" stroke="#55594D" stroke-width="1"/>
<text data-role="source" x="716" y="384" font-family="Arial" font-size="9" font-weight="700" fill="#B8B2A5" text-anchor="end"><tspan x="716" dy="0">SCENE → SOURCE → MEANING → ACTION</tspan></text>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#B8B2A5" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
</g>
</svg>
