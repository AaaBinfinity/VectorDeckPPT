<text data-role="subheading" x="56" y="258" font-family="Arial" font-size="14" font-weight="700" fill="#F7F8FC" text-anchor="start"><tspan x="56" dy="0">FRAME</tspan></text>
<text data-role="body" x="56" y="284" font-family="Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="start"><tspan x="56" dy="0">Confirm decision, baseline,</tspan><tspan x="56" dy="12.6">and success measure</tspan></text>
<text data-role="annotation" x="56" y="338" font-family="Arial" font-size="9" font-weight="700" fill="#7ACBFF" text-anchor="start"><tspan x="56" dy="0">OWNER A · W1</tspan></text>
