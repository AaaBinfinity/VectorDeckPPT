<text data-role="subheading" x="396" y="258" font-family="Arial" font-size="14" font-weight="700" fill="#F7F8FC" text-anchor="start"><tspan x="396" dy="0">ENABLE</tspan></text>
<text data-role="body" x="396" y="284" font-family="Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="start"><tspan x="396" dy="0">Document workflow, roles,</tspan><tspan x="396" dy="12.6">and acceptance criteria</tspan></text>
<text data-role="annotation" x="396" y="338" font-family="Arial" font-size="9" font-weight="700" fill="#7ACBFF" text-anchor="start"><tspan x="396" dy="0">OWNER C · W4</tspan></text>
<circle cx="584" cy="214" r="18" fill="#171D28" stroke="#FF1748" stroke-width="3"/>
<text data-role="page-number" x="584" y="219" font-family="Arial" font-size="10" font-weight="700" fill="#FF1748" text-anchor="middle"><tspan x="584" dy="0">04</tspan></text>
<text data-role="subheading" x="566" y="258" font-family="Arial" font-size="14" font-weight="700" fill="#F7F8FC" text-anchor="start"><tspan x="566" dy="0">SCALE</tspan></text>
<text data-role="body" x="566" y="284" font-family="Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="start"><tspan x="566" dy="0">Expand only after quality</tspan><tspan x="566" dy="12.6">and value signals hold</tspan></text>
<text data-role="annotation" x="566" y="338" font-family="Arial" font-size="9" font-weight="700" fill="#7ACBFF" text-anchor="start"><tspan x="566" dy="0">OWNER D · Q+1</tspan></text>
<rect x="34" y="354" width="686" height="24" rx="12" fill="#FF1748" stroke="none" stroke-width="0"/>
<text data-role="source" x="377" y="371" font-family="Arial" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="377" dy="0">EACH PHASE ENDS WITH A REVIEWABLE ARTIFACT, A DECISION, AND A NAMED OWNER</tspan></text>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#A6ADBC" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
