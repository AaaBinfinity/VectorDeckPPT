<text data-role="slide-title" x="34" y="88" font-family="Impact, Microsoft YaHei, Arial" font-size="26" font-weight="900" fill="#F7F8FC" text-anchor="start"><tspan x="34" dy="0">三个失配，让响应窗口不断收窄</tspan></text>
<text data-role="caption" x="34" y="116" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="start"><tspan x="34" dy="0">把表面症状拆成信号、权责与反馈三个机制问题，再说明它们如何共同放大风险。</tspan></text>
<polygon points="34,144 270,134 286,196 46,208" fill="#FF1748" stroke="#303746" stroke-width="1"/>
<text data-role="label" x="52" y="166" font-family="Impact" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="start"><tspan x="52" dy="0">01</tspan></text>
<text data-role="subheading" x="92" y="168" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="92" dy="0">信号失配</tspan></text>
<text data-role="body" x="166" y="160" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="166" dy="0">信息分散在多个入口，</tspan><tspan x="166" dy="12.15">关键变化无法被及时识别。</tspan></text>
<line x1="286" y1="170" x2="350" y2="236" stroke="#FF1748" stroke-width="2"/>
<polygon points="34,216 270,206 286,268 46,280" fill="#171D28" stroke="#303746" stroke-width="1"/>
<text data-role="label" x="52" y="238" font-family="Impact" font-size="10" font-weight="900" fill="#FF1748" text-anchor="start"><tspan x="52" dy="0">02</tspan></text>
<text data-role="subheading" x="92" y="240" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="700" fill="#F7F8FC" text-anchor="start"><tspan x="92" dy="0">权责失配</tspan></text>
<text data-role="body" x="166" y="232" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="start"><tspan x="166" dy="0">判断权、执行权与复核权</tspan><tspan x="166" dy="12.15">没有落在同一条责任链。</tspan></text>
<line x1="286" y1="242" x2="350" y2="236" stroke="#FF1748" stroke-width="2"/>
<polygon points="34,288 270,278 286,340 46,352" fill="#171D28" stroke="#303746" stroke-width="1"/>
<text data-role="label" x="52" y="310" font-family="Impact" font-size="10" font-weight="900" fill="#FF1748" text-anchor="start"><tspan x="52" dy="0">03</tspan></text>
<text data-role="subheading" x="92" y="312" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="700" fill="#F7F8FC" text-anchor="start"><tspan x="92" dy="0">反馈失配</tspan></text>
<text data-role="body" x="166" y="304" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="start"><tspan x="166" dy="0">结果回传缺少统一格式，</tspan><tspan x="166" dy="12.15">经验无法进入下一轮决策。</tspan></text>
<line x1="286" y1="314" x2="350" y2="236" stroke="#FF1748" stroke-width="2"/>
<circle cx="392" cy="236" r="72" fill="#070910" stroke="#FF1748" stroke-width="7"/>
