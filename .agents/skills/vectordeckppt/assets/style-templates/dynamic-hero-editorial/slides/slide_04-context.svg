<rect x="496" y="150" width="7" height="56" rx="0" fill="#FF1748" stroke="none" stroke-width="0"/>
<text data-role="subheading" x="518" y="172" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="700" fill="#F7F8FC" text-anchor="start"><tspan x="518" dy="0">判断变慢</tspan></text>
<text data-role="body" x="518" y="192" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="start"><tspan x="518" dy="0">关键证据到达时已经错过最佳窗口。</tspan></text>
<rect x="496" y="220" width="224" height="56" rx="0" fill="#101622" stroke="#303746" stroke-width="1"/>
<rect x="496" y="220" width="7" height="56" rx="0" fill="#FFBF3C" stroke="none" stroke-width="0"/>
<text data-role="subheading" x="518" y="242" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="700" fill="#F7F8FC" text-anchor="start"><tspan x="518" dy="0">协同变贵</tspan></text>
<text data-role="body" x="518" y="262" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="start"><tspan x="518" dy="0">团队重复核对，却仍无法形成共同事实。</tspan></text>
<rect x="496" y="290" width="224" height="56" rx="0" fill="#101622" stroke="#303746" stroke-width="1"/>
<rect x="496" y="290" width="7" height="56" rx="0" fill="#7ACBFF" stroke="none" stroke-width="0"/>
<text data-role="subheading" x="518" y="312" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="700" fill="#F7F8FC" text-anchor="start"><tspan x="518" dy="0">复盘失真</tspan></text>
<text data-role="body" x="518" y="332" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="start"><tspan x="518" dy="0">结果只被记录，没有转化为下一轮规则。</tspan></text>
<polygon points="34,364 698,346 720,382 50,396" fill="#080B12" stroke="#FF1748" stroke-width="2"/>
<text data-role="label" x="58" y="382" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="700" fill="#FF1748" text-anchor="start"><tspan x="58" dy="0">关键判断</tspan></text>
<text data-role="annotation" x="142" y="381" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="400" fill="#F7F8FC" text-anchor="start"><tspan x="142" dy="0">真正要优化的不是‘传得更快’，而是让信号、责任与反馈在同一条链上闭环。</tspan></text>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#A6ADBC" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
