<text data-role="label" x="392" y="246" font-family="Microsoft YaHei, Arial" font-size="10" font-weight="700" fill="#7ACBFF" text-anchor="middle"><tspan x="392" dy="0">示例响应窗口</tspan></text>
<text data-role="annotation" x="392" y="268" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="middle"><tspan x="392" dy="0">需替换为真实事实</tspan></text>
