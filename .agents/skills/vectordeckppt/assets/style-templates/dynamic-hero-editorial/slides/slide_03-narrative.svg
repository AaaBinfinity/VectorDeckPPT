<text data-role="body" x="572" y="238" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="start"><tspan x="572" dy="0">哪些记录、数据或引语</tspan><tspan x="572" dy="12.15">能够验证这个判断？</tspan></text>
