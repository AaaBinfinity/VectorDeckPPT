<text data-role="body" x="572" y="312" font-family="Microsoft YaHei, Arial" font-size="9" font-weight="400" fill="#A6ADBC" text-anchor="start"><tspan x="572" dy="0">这项发现改变哪项选择，</tspan><tspan x="572" dy="12.15">谁必须负责下一步？</tspan></text>
