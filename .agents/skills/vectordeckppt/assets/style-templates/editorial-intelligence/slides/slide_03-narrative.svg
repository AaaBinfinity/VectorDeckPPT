<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>EDITORIAL INTELLIGENCE narrative template</title>
<desc>One editable 16:9 narrative reference page from the EDITORIAL INTELLIGENCE multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#D8D4CC" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="0" fill="#F7F3EB" stroke="#BFB7AA" stroke-width="1"/>
<rect x="18" y="52" width="4" height="310" rx="0" fill="#C94A3A" stroke="none" stroke-width="0"/>
<line x1="42" y1="122" x2="730" y2="122" stroke="#BFB7AA" stroke-width="1"/>
<line x1="516" y1="38" x2="516" y2="372" stroke="#BFB7AA" stroke-width="0.8"/>
<text data-role="metric" x="720" y="320" font-family="Georgia" font-size="94" font-weight="700" fill="#EEE8DD" text-anchor="end"><tspan x="720" dy="0">03</tspan></text>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#1746A2" text-anchor="start"><tspan x="34" dy="0">NARRATIVE / ANNOTATION</tspan></text>
<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#5E5A54" text-anchor="end"><tspan x="718" dy="0">03</tspan></text>
<text data-role="slide-title" x="34" y="82" font-family="Georgia" font-size="26" font-weight="700" fill="#161616" text-anchor="start"><tspan x="34" dy="0">A credible story joins scene, source, and meaning</tspan></text>
<text data-role="caption" x="34" y="110" font-family="Arial" font-size="9" font-weight="400" fill="#5E5A54" text-anchor="start"><tspan x="34" dy="0">Connect a concrete scene, a sourced detail, an interpretation, and the decision it changes.</tspan></text>
<rect x="34" y="144" width="402" height="196" rx="0" fill="#EEE8DD" stroke="#BFB7AA" stroke-width="1"/>
<text data-role="quote" x="60" y="220" font-family="Georgia" font-size="80" font-weight="700" fill="#C94A3A" text-anchor="start"><tspan x="60" dy="0">“</tspan></text>
<text data-role="quote" x="126" y="212" font-family="Georgia" font-size="18" font-weight="700" fill="#161616" text-anchor="start"><tspan x="126" dy="0">A scene becomes evidence</tspan></text>
<text data-role="quote" x="126" y="240" font-family="Arial" font-size="12" font-weight="400" fill="#5E5A54" text-anchor="start"><tspan x="126" dy="0">only when the source, limit,</tspan></text>
<text data-role="quote" x="126" y="262" font-family="Arial" font-size="12" font-weight="400" fill="#5E5A54" text-anchor="start"><tspan x="126" dy="0">and consequence stay visible.</tspan></text>
<line x1="126" y1="282" x2="386" y2="282" stroke="#1746A2" stroke-width="3"/>
<text data-role="label" x="52" y="316" font-family="Arial" font-size="10" font-weight="700" fill="#161616" text-anchor="start"><tspan x="52" dy="0">FIELD NOTE / ORIGINAL PLACEHOLDER</tspan></text>
<text data-role="subheading" x="468" y="158" font-family="Arial" font-size="14" font-weight="700" fill="#1746A2" text-anchor="start"><tspan x="468" dy="0">01  SCENE</tspan></text>
<text data-role="body" x="468" y="182" font-family="Arial" font-size="9" font-weight="400" fill="#161616" text-anchor="start"><tspan x="468" dy="0">Who experiences the issue,</tspan><tspan x="468" dy="12.15">where it occurs, and what is at stake.</tspan></text>
<text data-role="subheading" x="468" y="236" font-family="Arial" font-size="14" font-weight="700" fill="#1746A2" text-anchor="start"><tspan x="468" dy="0">02  SOURCE</tspan></text>
<text data-role="body" x="468" y="260" font-family="Arial" font-size="9" font-weight="400" fill="#161616" text-anchor="start"><tspan x="468" dy="0">Name the observation, artifact,</tspan><tspan x="468" dy="12.15">quotation, date, and evidence limit.</tspan></text>
<text data-role="subheading" x="468" y="314" font-family="Arial" font-size="14" font-weight="700" fill="#1746A2" text-anchor="start"><tspan x="468" dy="0">03  MEANING</tspan></text>
<text data-role="body" x="468" y="338" font-family="Arial" font-size="9" font-weight="400" fill="#161616" text-anchor="start"><tspan x="468" dy="0">State what changes now, who decides,</tspan><tspan x="468" dy="12.15">and which proof the audience should inspect.</tspan></text>
<line x1="468" y1="366" x2="716" y2="366" stroke="#BFB7AA" stroke-width="1"/>
<text data-role="source" x="716" y="384" font-family="Arial" font-size="9" font-weight="700" fill="#5E5A54" text-anchor="end"><tspan x="716" dy="0">SCENE → SOURCE → MEANING → ACTION</tspan></text>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#5E5A54" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
</g>
</svg>
