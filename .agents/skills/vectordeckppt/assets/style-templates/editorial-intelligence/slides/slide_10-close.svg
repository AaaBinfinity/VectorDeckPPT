<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>EDITORIAL INTELLIGENCE close template</title>
<desc>One editable 16:9 close reference page from the EDITORIAL INTELLIGENCE multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#D8D4CC" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="0" fill="#F7F3EB" stroke="#BFB7AA" stroke-width="1"/>
<rect x="18" y="52" width="4" height="310" rx="0" fill="#C94A3A" stroke="none" stroke-width="0"/>
<line x1="42" y1="122" x2="730" y2="122" stroke="#BFB7AA" stroke-width="1"/>
<line x1="516" y1="38" x2="516" y2="372" stroke="#BFB7AA" stroke-width="0.8"/>
<text data-role="metric" x="720" y="320" font-family="Georgia" font-size="94" font-weight="700" fill="#EEE8DD" text-anchor="end"><tspan x="720" dy="0">10</tspan></text>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#1746A2" text-anchor="start"><tspan x="34" dy="0">RESOLUTION / NEXT MOVE</tspan></text>
<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#5E5A54" text-anchor="end"><tspan x="718" dy="0">10</tspan></text>
<text data-role="deck-title" x="54" y="126" font-family="Georgia" font-size="42" font-weight="700" fill="#161616" text-anchor="start"><tspan x="54" dy="0">Let the evidence carry the</tspan><tspan x="54" dy="42.84">recommendation</tspan></text>
<text data-role="subheading" x="58" y="220" font-family="Arial" font-size="14" font-weight="700" fill="#161616" text-anchor="start"><tspan x="58" dy="0">Close the argument with one choice, its consequence, and the next</tspan><tspan x="58" dy="18.2">source to inspect.</tspan></text>
<line x1="58" y1="258" x2="704" y2="258" stroke="#1746A2" stroke-width="2"/>
<text data-role="metric" x="58" y="298" font-family="Georgia" font-size="24" font-weight="700" fill="#1746A2" text-anchor="start"><tspan x="58" dy="0">01</tspan></text>
<text data-role="subheading" x="58" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#161616" text-anchor="start"><tspan x="58" dy="0">CHOICE</tspan></text>
<text data-role="body" x="58" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#5E5A54" text-anchor="start"><tspan x="58" dy="0">What the evidence supports</tspan></text>
<line x1="58" y1="372" x2="236" y2="372" stroke="#BFB7AA" stroke-width="1"/>
<text data-role="metric" x="274" y="298" font-family="Georgia" font-size="24" font-weight="700" fill="#C94A3A" text-anchor="start"><tspan x="274" dy="0">02</tspan></text>
<text data-role="subheading" x="274" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#161616" text-anchor="start"><tspan x="274" dy="0">CONSEQUENCE</tspan></text>
<text data-role="body" x="274" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#5E5A54" text-anchor="start"><tspan x="274" dy="0">What changes if approved</tspan></text>
<line x1="274" y1="372" x2="452" y2="372" stroke="#BFB7AA" stroke-width="1"/>
<text data-role="metric" x="490" y="298" font-family="Georgia" font-size="24" font-weight="700" fill="#C94A3A" text-anchor="start"><tspan x="490" dy="0">03</tspan></text>
<text data-role="subheading" x="490" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#161616" text-anchor="start"><tspan x="490" dy="0">NEXT SOURCE</tspan></text>
<text data-role="body" x="490" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#5E5A54" text-anchor="start"><tspan x="490" dy="0">What remains to inspect</tspan></text>
<line x1="490" y1="372" x2="668" y2="372" stroke="#BFB7AA" stroke-width="1"/>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#5E5A54" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
</g>
</svg>
