<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>BRIGHT TECH SYSTEMS context template</title>
<desc>One editable 16:9 context reference page from the BRIGHT TECH SYSTEMS multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#DCEBFA" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="18" fill="#F8FBFF" stroke="#B9D0EC" stroke-width="1"/>
<rect x="0" y="0" width="760" height="6" rx="18" fill="#1261D8" stroke="none" stroke-width="0"/>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#1261D8" text-anchor="start"><tspan x="34" dy="0">CONTEXT / PROBLEM</tspan></text>
<text data-role="page-number" x="714" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#526783" text-anchor="end"><tspan x="714" dy="0">04</tspan></text>
<text data-role="slide-title" x="34" y="82" font-family="Arial" font-size="26" font-weight="700" fill="#0B1F44" text-anchor="start"><tspan x="34" dy="0">Three conditions create the visible symptom</tspan></text>
<text data-role="caption" x="34" y="110" font-family="Arial" font-size="9" font-weight="400" fill="#526783" text-anchor="start"><tspan x="34" dy="0">Separate what is observed, what drives it, and what the audience can change.</tspan></text>
<rect x="34" y="146" width="212" height="164" rx="18" fill="#FFFFFF" stroke="#B9D0EC" stroke-width="1"/>
<text data-role="metric" x="52" y="176" font-family="Arial" font-size="20" font-weight="700" fill="#1261D8" text-anchor="start"><tspan x="52" dy="0">01</tspan></text>
<text data-role="subheading" x="52" y="208" font-family="Arial" font-size="14" font-weight="700" fill="#0B1F44" text-anchor="start"><tspan x="52" dy="0">OBSERVED SIGNAL</tspan></text>
<text data-role="body" x="52" y="236" font-family="Arial" font-size="9" font-weight="400" fill="#526783" text-anchor="start"><tspan x="52" dy="0">Name the concrete symptom,</tspan><tspan x="52" dy="12.42">affected audience, timing,</tspan><tspan x="52" dy="12.42">and scale. Keep facts separate</tspan><tspan x="52" dy="12.42">from interpretation.</tspan></text>
<line x1="246" y1="228" x2="264" y2="228" stroke="#1261D8" stroke-width="3"/>
<rect x="264" y="146" width="212" height="164" rx="18" fill="#FFFFFF" stroke="#B9D0EC" stroke-width="1"/>
<text data-role="metric" x="282" y="176" font-family="Arial" font-size="20" font-weight="700" fill="#11A9CC" text-anchor="start"><tspan x="282" dy="0">02</tspan></text>
<text data-role="subheading" x="282" y="208" font-family="Arial" font-size="14" font-weight="700" fill="#0B1F44" text-anchor="start"><tspan x="282" dy="0">UNDERLYING DRIVER</tspan></text>
<text data-role="body" x="282" y="236" font-family="Arial" font-size="9" font-weight="400" fill="#526783" text-anchor="start"><tspan x="282" dy="0">Explain the mechanism or</tspan><tspan x="282" dy="12.42">constraint that repeatedly</tspan><tspan x="282" dy="12.42">creates the signal. Show</tspan><tspan x="282" dy="12.42">directional evidence.</tspan></text>
<line x1="476" y1="228" x2="494" y2="228" stroke="#1261D8" stroke-width="3"/>
<rect x="494" y="146" width="212" height="164" rx="18" fill="#FFFFFF" stroke="#B9D0EC" stroke-width="1"/>
<text data-role="metric" x="512" y="176" font-family="Arial" font-size="20" font-weight="700" fill="#11A9CC" text-anchor="start"><tspan x="512" dy="0">03</tspan></text>
<text data-role="subheading" x="512" y="208" font-family="Arial" font-size="14" font-weight="700" fill="#0B1F44" text-anchor="start"><tspan x="512" dy="0">DECISION LEVER</tspan></text>
<text data-role="body" x="512" y="236" font-family="Arial" font-size="9" font-weight="400" fill="#526783" text-anchor="start"><tspan x="512" dy="0">Identify the choice, owner,</tspan><tspan x="512" dy="12.42">and boundary the audience</tspan><tspan x="512" dy="12.42">can influence now. State</tspan><tspan x="512" dy="12.42">what proof is needed next.</tspan></text>
<rect x="34" y="330" width="686" height="48" rx="18" fill="#F8FBFF" stroke="#B9D0EC" stroke-width="1"/>
<text data-role="label" x="52" y="350" font-family="Arial" font-size="10" font-weight="700" fill="#1261D8" text-anchor="start"><tspan x="52" dy="0">IMPLICATION</tspan></text>
<text data-role="annotation" x="148" y="350" font-family="Arial" font-size="9" font-weight="700" fill="#0B1F44" text-anchor="start"><tspan x="148" dy="0">The deck should prove the driver before asking the audience to approve the lever.</tspan></text>
<text data-role="annotation" x="148" y="368" font-family="Arial" font-size="9" font-weight="400" fill="#526783" text-anchor="start"><tspan x="148" dy="0">Replace every illustrative statement with sourced project facts, examples, or clearly marked unknowns.</tspan></text>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#526783" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
</g>
</svg>
