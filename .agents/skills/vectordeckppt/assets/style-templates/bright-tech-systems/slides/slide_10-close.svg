<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#1261D8" text-anchor="start"><tspan x="34" dy="0">RESOLUTION / NEXT MOVE</tspan></text>
<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#526783" text-anchor="end"><tspan x="718" dy="0">10</tspan></text>
<text data-role="deck-title" x="54" y="126" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="700" fill="#0B1F44" text-anchor="start"><tspan x="54" dy="0">Make the operating model</tspan><tspan x="54" dy="42.84">repeatable</tspan></text>
<text data-role="subheading" x="58" y="220" font-family="Arial" font-size="14" font-weight="700" fill="#0B1F44" text-anchor="start"><tspan x="58" dy="0">Approve the standard, name the owners, and verify the first</tspan><tspan x="58" dy="18.2">milestone.</tspan></text>
<line x1="58" y1="258" x2="704" y2="258" stroke="#1261D8" stroke-width="2"/>
<text data-role="metric" x="58" y="298" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="700" fill="#1261D8" text-anchor="start"><tspan x="58" dy="0">01</tspan></text>
<text data-role="subheading" x="58" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#0B1F44" text-anchor="start"><tspan x="58" dy="0">STANDARD</tspan></text>
<text data-role="body" x="58" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#526783" text-anchor="start"><tspan x="58" dy="0">What becomes repeatable</tspan></text>
<line x1="58" y1="372" x2="236" y2="372" stroke="#B9D0EC" stroke-width="1"/>
<text data-role="metric" x="274" y="298" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="700" fill="#11A9CC" text-anchor="start"><tspan x="274" dy="0">02</tspan></text>
<text data-role="subheading" x="274" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#0B1F44" text-anchor="start"><tspan x="274" dy="0">OWNER</tspan></text>
<text data-role="body" x="274" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#526783" text-anchor="start"><tspan x="274" dy="0">Who runs the next cycle</tspan></text>
<line x1="274" y1="372" x2="452" y2="372" stroke="#B9D0EC" stroke-width="1"/>
<text data-role="metric" x="490" y="298" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="700" fill="#11A9CC" text-anchor="start"><tspan x="490" dy="0">03</tspan></text>
<text data-role="subheading" x="490" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#0B1F44" text-anchor="start"><tspan x="490" dy="0">MILESTONE</tspan></text>
<text data-role="body" x="490" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#526783" text-anchor="start"><tspan x="490" dy="0">What proof closes the loop</tspan></text>
