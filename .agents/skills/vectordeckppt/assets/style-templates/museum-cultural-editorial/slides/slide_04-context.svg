<text data-role="label" x="638" y="252" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="10" font-weight="700" fill="#F5EFE4" text-anchor="middle"><tspan x="638" dy="0">DECISION LEVER</tspan></text>
<text data-role="body" x="638" y="316" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="9" font-weight="400" fill="#B8ACA0" text-anchor="middle"><tspan x="638" dy="0">State the choice, owner, boundary,</tspan><tspan x="638" dy="11.7">and next proof point.</tspan></text>
