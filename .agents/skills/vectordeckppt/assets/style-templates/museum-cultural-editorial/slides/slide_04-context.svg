<text data-role="body" x="126" y="250" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="9" font-weight="400" fill="#B8ACA0" text-anchor="middle"><tspan x="126" dy="0">Name the concrete symptom,</tspan><tspan x="126" dy="11.7">audience, scale, and timing.</tspan></text>
