<text data-role="annotation" x="382" y="294" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="9" font-weight="400" fill="#B8ACA0" text-anchor="middle"><tspan x="382" dy="0">illustrative window</tspan></text>
