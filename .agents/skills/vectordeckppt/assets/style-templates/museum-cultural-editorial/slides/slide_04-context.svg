<text data-role="annotation" x="404" y="352" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="9" font-weight="400" fill="#F5EFE4" text-anchor="start"><tspan x="404" dy="0">Prove the driver before asking</tspan><tspan x="404" dy="11.25">for approval of the lever.</tspan></text>
