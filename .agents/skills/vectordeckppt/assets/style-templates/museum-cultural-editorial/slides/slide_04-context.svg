<text data-role="caption" x="34" y="110" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="9" font-weight="400" fill="#B8ACA0" text-anchor="start"><tspan x="34" dy="0">Separate the observed signal, the mechanism beneath it, and the lever the audience can influence.</tspan></text>
