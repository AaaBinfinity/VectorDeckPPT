<text data-role="label" x="242" y="206" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="10" font-weight="700" fill="#C6A565" text-anchor="start"><tspan x="242" dy="0">CATALOG A-017</tspan></text>
<text data-role="subheading" x="242" y="236" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#F5EFE4" text-anchor="start"><tspan x="242" dy="0">Material / Trace / Context</tspan></text>
<text data-role="quote" x="242" y="266" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="10" font-weight="400" fill="#B8ACA0" text-anchor="start"><tspan x="242" dy="0">Observe first. Interpret second.</tspan></text>
<text data-role="label" x="52" y="316" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="52" dy="0">FIELD NOTE / ORIGINAL PLACEHOLDER</tspan></text>
<text data-role="subheading" x="468" y="158" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#A43B2F" text-anchor="start"><tspan x="468" dy="0">01  SCENE</tspan></text>
<text data-role="body" x="468" y="182" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="9" font-weight="400" fill="#F5EFE4" text-anchor="start"><tspan x="468" dy="0">Who experiences the issue,</tspan><tspan x="468" dy="12.15">where it occurs, and what is at stake.</tspan></text>
<text data-role="subheading" x="468" y="236" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#A43B2F" text-anchor="start"><tspan x="468" dy="0">02  SOURCE</tspan></text>
<text data-role="body" x="468" y="260" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="9" font-weight="400" fill="#F5EFE4" text-anchor="start"><tspan x="468" dy="0">Name the observation, artifact,</tspan><tspan x="468" dy="12.15">quotation, date, and evidence limit.</tspan></text>
<text data-role="subheading" x="468" y="314" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#A43B2F" text-anchor="start"><tspan x="468" dy="0">03  MEANING</tspan></text>
<text data-role="body" x="468" y="338" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="9" font-weight="400" fill="#F5EFE4" text-anchor="start"><tspan x="468" dy="0">State what changes now, who decides,</tspan><tspan x="468" dy="12.15">and which proof the audience should inspect.</tspan></text>
