<text data-role="slide-title" x="34" y="82" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="26" font-weight="700" fill="#F5EFE4" text-anchor="start"><tspan x="34" dy="0">从细节中读出物件的社会生命</tspan></text>
<text data-role="caption" x="34" y="110" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="9" font-weight="400" fill="#B8ACA0" text-anchor="start"><tspan x="34" dy="0">Connect a concrete scene, a sourced detail, an interpretation, and the decision it changes.</tspan></text>
