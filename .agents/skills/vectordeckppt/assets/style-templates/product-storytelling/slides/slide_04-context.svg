<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>PRODUCT STORYTELLING context template</title>
<desc>One editable 16:9 context reference page from the PRODUCT STORYTELLING multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#DDE8E3" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="22" fill="#F8FBF9" stroke="#B7CBC3" stroke-width="1"/>
<rect x="500" y="82" width="222" height="244" rx="28" fill="#FFFFFF" stroke="#B7CBC3" stroke-width="2"/>
<rect x="518" y="102" width="186" height="22" rx="11" fill="#F8FBF9" stroke="none" stroke-width="0"/>
<rect x="518" y="140" width="126" height="58" rx="16" fill="#19765F" stroke="none" stroke-width="0"/>
<rect x="654" y="140" width="50" height="58" rx="16" fill="#E46B4F" stroke="none" stroke-width="0"/>
<rect x="518" y="212" width="186" height="94" rx="18" fill="#F8FBF9" stroke="#B7CBC3" stroke-width="1"/>
<polyline points="532,278 568,246 610,262 650,226 690,238" fill="none" stroke="#E46B4F" stroke-width="4"/>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#19765F" text-anchor="start"><tspan x="34" dy="0">CONTEXT / PROBLEM</tspan></text>
<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#60736E" text-anchor="end"><tspan x="718" dy="0">04</tspan></text>
<text data-role="slide-title" x="34" y="82" font-family="Aptos Display, Arial, sans-serif" font-size="26" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="34" dy="0">Three friction points delay the first value moment</tspan></text>
<text data-role="caption" x="34" y="110" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="start"><tspan x="34" dy="0">Separate the observed signal, the mechanism beneath it, and the lever the audience can influence.</tspan></text>
<circle cx="382" cy="246" r="64" fill="#FFFFFF" stroke="#19765F" stroke-width="3"/>
<text data-role="label" x="382" y="240" font-family="Arial" font-size="10" font-weight="700" fill="#19765F" text-anchor="middle"><tspan x="382" dy="0">DECISION</tspan></text>
<text data-role="metric" x="382" y="274" font-family="Aptos Display, Arial, sans-serif" font-size="28" font-weight="700" fill="#102A25" text-anchor="middle"><tspan x="382" dy="0">24h</tspan></text>
<text data-role="annotation" x="382" y="294" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="middle"><tspan x="382" dy="0">illustrative window</tspan></text>
<line x1="214" y1="178" x2="316" y2="246" stroke="#E46B4F" stroke-width="2"/>
<circle cx="126" cy="178" r="46" fill="#FFFFFF" stroke="#B7CBC3" stroke-width="1.5"/>
<text data-role="metric" x="126" y="164" font-family="Aptos Display, Arial, sans-serif" font-size="18" font-weight="700" fill="#19765F" text-anchor="middle"><tspan x="126" dy="0">01</tspan></text>
<text data-role="label" x="126" y="186" font-family="Arial" font-size="10" font-weight="700" fill="#102A25" text-anchor="middle"><tspan x="126" dy="0">OBSERVED SIGNAL</tspan></text>
<text data-role="body" x="126" y="250" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="middle"><tspan x="126" dy="0">Name the concrete symptom,</tspan><tspan x="126" dy="11.7">audience, scale, and timing.</tspan></text>
<line x1="214" y1="310" x2="316" y2="246" stroke="#E46B4F" stroke-width="2"/>
<circle cx="126" cy="310" r="46" fill="#FFFFFF" stroke="#B7CBC3" stroke-width="1.5"/>
<text data-role="metric" x="126" y="296" font-family="Aptos Display, Arial, sans-serif" font-size="18" font-weight="700" fill="#19765F" text-anchor="middle"><tspan x="126" dy="0">02</tspan></text>
<text data-role="label" x="126" y="318" font-family="Arial" font-size="10" font-weight="700" fill="#102A25" text-anchor="middle"><tspan x="126" dy="0">UNDERLYING DRIVER</tspan></text>
<text data-role="body" x="126" y="382" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="middle"><tspan x="126" dy="0">Show the mechanism, constraint,</tspan><tspan x="126" dy="11.7">or repeated handoff failure.</tspan></text>
<line x1="550" y1="244" x2="448" y2="246" stroke="#E46B4F" stroke-width="2"/>
<circle cx="638" cy="244" r="46" fill="#FFFFFF" stroke="#B7CBC3" stroke-width="1.5"/>
<text data-role="metric" x="638" y="230" font-family="Aptos Display, Arial, sans-serif" font-size="18" font-weight="700" fill="#19765F" text-anchor="middle"><tspan x="638" dy="0">03</tspan></text>
<text data-role="label" x="638" y="252" font-family="Arial" font-size="10" font-weight="700" fill="#102A25" text-anchor="middle"><tspan x="638" dy="0">DECISION LEVER</tspan></text>
<text data-role="body" x="638" y="316" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="middle"><tspan x="638" dy="0">State the choice, owner, boundary,</tspan><tspan x="638" dy="11.7">and next proof point.</tspan></text>
<rect x="286" y="336" width="286" height="46" rx="10" fill="#FFFFFF" stroke="#B7CBC3" stroke-width="1"/>
<text data-role="label" x="304" y="356" font-family="Arial" font-size="10" font-weight="700" fill="#19765F" text-anchor="start"><tspan x="304" dy="0">IMPLICATION</tspan></text>
<text data-role="annotation" x="404" y="352" font-family="Arial" font-size="9" font-weight="400" fill="#102A25" text-anchor="start"><tspan x="404" dy="0">Prove the driver before asking</tspan><tspan x="404" dy="11.25">for approval of the lever.</tspan></text>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#60736E" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
</g>
</svg>
