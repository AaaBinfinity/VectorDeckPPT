<text data-role="deck-title" x="190" y="142" font-family="Aptos Display, Arial, sans-serif" font-size="44" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="190" dy="0">MOVE FROM</tspan><tspan x="190" dy="44">FRICTION TO VALUE</tspan></text>
<text data-role="subheading" x="194" y="246" font-family="Arial" font-size="14" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="194" dy="0">Show the user moment, the product behavior, and the proof of change.</tspan></text>
<text data-role="body" x="194" y="274" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="start"><tspan x="194" dy="0">The chapter opener changes pace while the ordinary title and evidence tokens stay exact.</tspan></text>
