<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>PRODUCT STORYTELLING section template</title>
<desc>One editable 16:9 section reference page from the PRODUCT STORYTELLING multi-page template family.</desc>
