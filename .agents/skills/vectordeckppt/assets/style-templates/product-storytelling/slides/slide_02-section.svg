<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#19765F" text-anchor="start"><tspan x="34" dy="0">SECTION / CHAPTER</tspan></text>
<text data-role="page-number" x="714" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#60736E" text-anchor="end"><tspan x="714" dy="0">02</tspan></text>
