<text data-role="deck-title" x="210" y="146" font-family="Arial" font-size="46" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="210" dy="0">Turn the evidence</tspan><tspan x="210" dy="46.92">into a decision</tspan></text>
<text data-role="subheading" x="214" y="246" font-family="Arial" font-size="14" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="214" dy="0">A chapter opener creates a deliberate change in pace without changing the design system.</tspan></text>
<text data-role="body" x="214" y="282" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="start"><tspan x="214" dy="0">The display role may be expressive; ordinary slide titles remain locked and exact.</tspan></text>
