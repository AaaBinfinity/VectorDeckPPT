<text data-role="slide-title" x="34" y="82" font-family="Aptos Display, Arial, sans-serif" font-size="26" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="34" dy="0">Sequence adoption around the user&#x27;s next success</tspan><tspan x="34" dy="27.3">moment</tspan></text>
<text data-role="caption" x="34" y="136" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="start"><tspan x="34" dy="0">Each phase ends with a reviewable artifact, a named owner, an acceptance condition, and a decision.</tspan></text>
