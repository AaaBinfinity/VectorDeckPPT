<text data-role="source" x="190" y="366" font-family="Arial" font-size="9" font-weight="400" fill="#102A25" text-anchor="start"><tspan x="190" dy="0">Evidence, owner, and acceptance condition must all be explicit before the next stage.</tspan></text>
