<text data-role="subheading" x="190" y="222" font-family="Arial" font-size="14" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="190" dy="0">Read</tspan></text>
<text data-role="body" x="190" y="246" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="start"><tspan x="190" dy="0">Extract facts,</tspan><tspan x="190" dy="11.88">constraints, and tensions</tspan></text>
