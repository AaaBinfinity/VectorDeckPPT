<text data-role="body" x="466" y="252" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="start"><tspan x="466" dy="0">Review fidelity,</tspan><tspan x="466" dy="11.88">meaning, and exceptions</tspan></text>
