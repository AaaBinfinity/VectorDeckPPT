<text data-role="subheading" x="604" y="254" font-family="Arial" font-size="14" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="604" dy="0">Act</tspan></text>
<text data-role="body" x="604" y="278" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="start"><tspan x="604" dy="0">Assign the next</tspan><tspan x="604" dy="11.88">move, owner, and timing</tspan></text>
