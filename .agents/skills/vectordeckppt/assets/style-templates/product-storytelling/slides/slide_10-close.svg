<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>PRODUCT STORYTELLING close template</title>
<desc>One editable 16:9 close reference page from the PRODUCT STORYTELLING multi-page template family.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#DDE8E3" stroke="none" stroke-width="0"/>
<g transform="translate(40 50) scale(2)">
<rect x="0" y="0" width="760" height="400" rx="22" fill="#F8FBF9" stroke="#B7CBC3" stroke-width="1"/>
<rect x="500" y="82" width="222" height="244" rx="28" fill="#FFFFFF" stroke="#B7CBC3" stroke-width="2"/>
<rect x="518" y="102" width="186" height="22" rx="11" fill="#F8FBF9" stroke="none" stroke-width="0"/>
<rect x="518" y="140" width="126" height="58" rx="16" fill="#19765F" stroke="none" stroke-width="0"/>
<rect x="654" y="140" width="50" height="58" rx="16" fill="#E46B4F" stroke="none" stroke-width="0"/>
<rect x="518" y="212" width="186" height="94" rx="18" fill="#F8FBF9" stroke="#B7CBC3" stroke-width="1"/>
<polyline points="532,278 568,246 610,262 650,226 690,238" fill="none" stroke="#E46B4F" stroke-width="4"/>
<text data-role="label" x="34" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#19765F" text-anchor="start"><tspan x="34" dy="0">RESOLUTION / NEXT MOVE</tspan></text>
<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#60736E" text-anchor="end"><tspan x="718" dy="0">10</tspan></text>
<text data-role="deck-title" x="54" y="126" font-family="Aptos Display, Arial, sans-serif" font-size="42" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="54" dy="0">Make the next user success</tspan><tspan x="54" dy="42.84">inevitable</tspan></text>
<text data-role="subheading" x="58" y="220" font-family="Arial" font-size="14" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="58" dy="0">Approve the pilot, the enablement owner, and the proof required for</tspan><tspan x="58" dy="18.2">expansion.</tspan></text>
<line x1="58" y1="258" x2="704" y2="258" stroke="#19765F" stroke-width="2"/>
<text data-role="metric" x="58" y="298" font-family="Aptos Display, Arial, sans-serif" font-size="24" font-weight="700" fill="#19765F" text-anchor="start"><tspan x="58" dy="0">01</tspan></text>
<text data-role="subheading" x="58" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="58" dy="0">PILOT</tspan></text>
<text data-role="body" x="58" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="start"><tspan x="58" dy="0">What user moment to prove</tspan></text>
<line x1="58" y1="372" x2="236" y2="372" stroke="#B7CBC3" stroke-width="1"/>
<text data-role="metric" x="274" y="298" font-family="Aptos Display, Arial, sans-serif" font-size="24" font-weight="700" fill="#E46B4F" text-anchor="start"><tspan x="274" dy="0">02</tspan></text>
<text data-role="subheading" x="274" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="274" dy="0">ENABLEMENT</tspan></text>
<text data-role="body" x="274" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="start"><tspan x="274" dy="0">Who removes the friction</tspan></text>
<line x1="274" y1="372" x2="452" y2="372" stroke="#B7CBC3" stroke-width="1"/>
<text data-role="metric" x="490" y="298" font-family="Aptos Display, Arial, sans-serif" font-size="24" font-weight="700" fill="#E46B4F" text-anchor="start"><tspan x="490" dy="0">03</tspan></text>
<text data-role="subheading" x="490" y="330" font-family="Arial" font-size="14" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="490" dy="0">SUCCESS</tspan></text>
<text data-role="body" x="490" y="354" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="start"><tspan x="490" dy="0">What permits expansion</tspan></text>
<line x1="490" y1="372" x2="668" y2="372" stroke="#B7CBC3" stroke-width="1"/>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#60736E" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
</g>
</svg>
