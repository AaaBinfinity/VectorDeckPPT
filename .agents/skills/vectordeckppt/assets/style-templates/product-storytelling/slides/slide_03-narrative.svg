<text data-role="page-number" x="718" y="34" font-family="Arial" font-size="10" font-weight="700" fill="#60736E" text-anchor="end"><tspan x="718" dy="0">03</tspan></text>
<text data-role="slide-title" x="34" y="82" font-family="Aptos Display, Arial, sans-serif" font-size="26" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="34" dy="0">The product becomes real in one user moment</tspan></text>
<text data-role="caption" x="34" y="110" font-family="Arial" font-size="9" font-weight="400" fill="#60736E" text-anchor="start"><tspan x="34" dy="0">Connect a concrete scene, a sourced detail, an interpretation, and the decision it changes.</tspan></text>
