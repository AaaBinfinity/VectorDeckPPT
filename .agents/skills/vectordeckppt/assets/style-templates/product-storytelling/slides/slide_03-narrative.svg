<line x1="323" y1="236" x2="340" y2="214" stroke="#FFFFFF" stroke-width="4"/>
<text data-role="label" x="52" y="316" font-family="Arial" font-size="10" font-weight="700" fill="#102A25" text-anchor="start"><tspan x="52" dy="0">FIELD NOTE / ORIGINAL PLACEHOLDER</tspan></text>
<text data-role="subheading" x="468" y="158" font-family="Arial" font-size="14" font-weight="700" fill="#19765F" text-anchor="start"><tspan x="468" dy="0">01  SCENE</tspan></text>
<text data-role="body" x="468" y="182" font-family="Arial" font-size="9" font-weight="400" fill="#102A25" text-anchor="start"><tspan x="468" dy="0">Who experiences the issue,</tspan><tspan x="468" dy="12.15">where it occurs, and what is at stake.</tspan></text>
<text data-role="subheading" x="468" y="236" font-family="Arial" font-size="14" font-weight="700" fill="#19765F" text-anchor="start"><tspan x="468" dy="0">02  SOURCE</tspan></text>
<text data-role="body" x="468" y="260" font-family="Arial" font-size="9" font-weight="400" fill="#102A25" text-anchor="start"><tspan x="468" dy="0">Name the observation, artifact,</tspan><tspan x="468" dy="12.15">quotation, date, and evidence limit.</tspan></text>
<text data-role="subheading" x="468" y="314" font-family="Arial" font-size="14" font-weight="700" fill="#19765F" text-anchor="start"><tspan x="468" dy="0">03  MEANING</tspan></text>
<text data-role="body" x="468" y="338" font-family="Arial" font-size="9" font-weight="400" fill="#102A25" text-anchor="start"><tspan x="468" dy="0">State what changes now, who decides,</tspan><tspan x="468" dy="12.15">and which proof the audience should inspect.</tspan></text>
<line x1="468" y1="366" x2="716" y2="366" stroke="#B7CBC3" stroke-width="1"/>
<text data-role="source" x="716" y="384" font-family="Arial" font-size="9" font-weight="700" fill="#60736E" text-anchor="end"><tspan x="716" dy="0">SCENE → SOURCE → MEANING → ACTION</tspan></text>
<text data-role="source" x="724" y="392" font-family="Arial" font-size="9" font-weight="700" fill="#60736E" text-anchor="end"><tspan x="724" dy="0">ILLUSTRATIVE TEMPLATE</tspan></text>
