<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <text x="96" y="126" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="52" font-weight="700" fill="#0F172A">每一页都经过同一套质量闭环</text>
  <text x="96" y="180" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" fill="#475569">从 XML 合法性到 PowerPoint 实际渲染，问题在交付前被显性化。</text>

  <line x1="254" y1="314" x2="1346" y2="314" stroke="#CBD5E1" stroke-width="4"/>
  <circle cx="254" cy="314" r="18" fill="#2563EB"/>
  <circle cx="618" cy="314" r="18" fill="#2563EB"/>
  <circle cx="982" cy="314" r="18" fill="#7C3AED"/>
  <circle cx="1346" cy="314" r="18" fill="#7C3AED"/>
  <text x="254" y="260" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#0F172A">Validate</text>
  <text x="618" y="260" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#0F172A">Render</text>
  <text x="982" y="260" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#0F172A">Review</text>
  <text x="1346" y="260" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#0F172A">Revise</text>

  <rect x="96" y="386" width="1408" height="326" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
  <rect x="136" y="430" width="520" height="238" rx="20" fill="#EFF6FF"/>
  <text x="176" y="486" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#1D4ED8">确定性检查</text>
  <text x="176" y="542" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#334155">XML · viewBox · 远程资源 · 图片路径</text>
  <text x="176" y="586" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#334155">越界 · 异常尺寸 · PPTX 关系完整性</text>
  <text x="176" y="630" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#64748B">机器负责重复、准确、可回归的判断</text>

  <line x1="718" y1="432" x2="718" y2="668" stroke="#E2E8F0" stroke-width="3"/>
  <text x="782" y="486" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#6D28D9">视觉判断</text>
  <text x="782" y="542" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#334155">层级 · 对齐 · 留白 · 密度 · 图片裁剪</text>
  <text x="782" y="586" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#334155">标题换行 · 文本基线 · 主题效果偏差</text>
  <text x="782" y="630" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#64748B">Agent 查看真实预览并决定如何修改</text>

  <text x="1504" y="828" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8">04 / 05</text>
</svg>
