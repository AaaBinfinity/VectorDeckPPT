    <text x="1234" y="362" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">06</text>
    <text x="1450" y="362" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">07</text>

    <text x="150" y="444" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">读资料</text>
    <text x="367" y="444" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">定叙事</text>
    <text x="584" y="444" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">定风格</text>
