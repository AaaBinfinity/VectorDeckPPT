    <circle cx="150" cy="352" r="30" fill="#155EEF"/>
    <circle cx="367" cy="352" r="30" fill="#155EEF"/>
    <circle cx="584" cy="352" r="30" fill="#155EEF"/>
    <circle cx="800" cy="352" r="30" fill="#155EEF"/>
    <circle cx="1017" cy="352" r="30" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>
    <circle cx="1234" cy="352" r="30" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>
    <circle cx="1450" cy="352" r="30" fill="#B8F34A" stroke="#111827" stroke-width="4"/>

    <text x="150" y="362" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">01</text>
