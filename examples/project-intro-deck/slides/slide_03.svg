    <rect x="96" y="224" width="1408" height="246" fill="#111827"/>
    <text x="136" y="278" font-size="22" font-weight="700" fill="#B8F34A">HOST AGENT · 创造性判断</text>
    <line x1="549" y1="316" x2="549" y2="426" stroke="#4B5563" stroke-width="2"/>
    <line x1="1017" y1="316" x2="1017" y2="426" stroke="#4B5563" stroke-width="2"/>
    <text x="136" y="358" font-size="34" font-weight="700" fill="#FFFFFF">理解与提炼</text>
    <text x="136" y="402" font-size="23" fill="#D1D5DB">读资料、辨证据、定受众</text>
    <text x="604" y="358" font-size="34" font-weight="700" fill="#FFFFFF">叙事与艺术方向</text>
    <text x="604" y="402" font-size="23" fill="#D1D5DB">组织故事、定义视觉命题</text>
    <text x="1072" y="358" font-size="34" font-weight="700" fill="#FFFFFF">逐页视觉复审</text>
    <text x="1072" y="402" font-size="23" fill="#D1D5DB">看实际渲染，不只看源码</text>

    <rect x="96" y="486" width="1408" height="246" fill="#FFFFFF" stroke="#D4CFC4" stroke-width="2"/>
    <text x="136" y="540" font-size="22" font-weight="700" fill="#155EEF">DETERMINISTIC TOOLS · 确定性执行</text>
    <line x1="549" y1="578" x2="549" y2="688" stroke="#D4CFC4" stroke-width="2"/>
    <line x1="1017" y1="578" x2="1017" y2="688" stroke="#D4CFC4" stroke-width="2"/>
    <text x="136" y="620" font-size="34" font-weight="700" fill="#111827">SVG 校验</text>
    <text x="136" y="664" font-size="23" fill="#6B7280">安全、尺寸、元素与资源</text>
    <text x="604" y="620" font-size="34" font-weight="700" fill="#111827">渲染与编译</text>
    <text x="604" y="664" font-size="23" fill="#6B7280">预览 PNG，生成可编辑 PPTX</text>
    <text x="1072" y="620" font-size="34" font-weight="700" fill="#111827">PPTX 验证</text>
    <text x="1072" y="664" font-size="23" fill="#6B7280">包结构、关系与对象检查</text>

    <rect x="760" y="454" width="80" height="48" fill="#155EEF"/>
    <text x="800" y="486" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">SVG</text>
    <text x="96" y="832" font-size="20" fill="#6B7280">ONE RESPONSIBILITY PER LAYER</text>
    <text x="1504" y="832" text-anchor="end" font-size="20" fill="#6B7280">03</text>
