<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#F4F1EA"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="96" y="118" font-size="54" font-weight="700" fill="#111827">一页 SVG，是设计、审查与修改的共同真源</text>
    <text x="96" y="166" font-size="22" fill="#6B7280">不是把 SVG 当作小图标，而是让它完整描述一张幻灯片。</text>

    <rect x="96" y="224" width="870" height="489" rx="8" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>
    <text x="136" y="278" font-size="20" font-weight="700" fill="#155EEF">SLIDE_05.SVG · 1600 × 900</text>
    <rect x="136" y="316" width="470" height="24" fill="#111827"/>
    <rect x="136" y="364" width="332" height="12" fill="#D4CFC4"/>
    <rect x="136" y="418" width="348" height="212" fill="#155EEF"/>
    <circle cx="310" cy="524" r="74" fill="#B8F34A"/>
    <rect x="526" y="418" width="386" height="28" fill="#111827"/>
    <rect x="526" y="470" width="312" height="12" fill="#D4CFC4"/>
    <rect x="526" y="504" width="348" height="12" fill="#D4CFC4"/>
    <rect x="526" y="538" width="266" height="12" fill="#D4CFC4"/>
    <line x1="526" y1="594" x2="894" y2="594" stroke="#155EEF" stroke-width="4"/>
    <text x="906" y="686" text-anchor="end" font-size="18" fill="#6B7280">所有可见元素都在同一坐标系内</text>

    <text x="1048" y="290" font-size="24" font-weight="700" fill="#155EEF">同一份源文件</text>
    <text x="1048" y="356" font-size="38" font-weight="700" fill="#111827">定义视觉</text>
    <text x="1048" y="394" font-size="22" fill="#6B7280">完整层级、空间、颜色与文案</text>
    <line x1="1048" y1="432" x2="1504" y2="432" stroke="#D4CFC4" stroke-width="2"/>
    <text x="1048" y="486" font-size="38" font-weight="700" fill="#111827">生成预览</text>
    <text x="1048" y="524" font-size="22" fill="#6B7280">渲染 PNG，支持真实视觉复审</text>
    <line x1="1048" y1="562" x2="1504" y2="562" stroke="#D4CFC4" stroke-width="2"/>
    <text x="1048" y="616" font-size="38" font-weight="700" fill="#111827">编译对象</text>
    <text x="1048" y="654" font-size="22" fill="#6B7280">转换为 PowerPoint 原生内容</text>

    <rect x="1048" y="704" width="456" height="64" fill="#B8F34A"/>
    <text x="1076" y="746" font-size="24" font-weight="700" fill="#111827">修改入口始终清晰：回到 SVG</text>
    <text x="1504" y="832" text-anchor="end" font-size="20" fill="#6B7280">05</text>
  </g>
</svg>
