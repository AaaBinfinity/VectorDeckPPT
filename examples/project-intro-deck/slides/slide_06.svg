    <text x="111" y="88" text-anchor="middle" font-size="48" font-weight="700" fill="#FFFFFF">06</text>
    <text x="238" y="88" font-size="40" font-weight="700" fill="#0A1B3E">转换策略优先保留编辑能力，再保住视觉</text>
    <text x="1504" y="58" text-anchor="end" font-size="20" font-weight="700" fill="#1263E6">VectorDeckPPT</text>
    <text x="1504" y="84" text-anchor="end" font-size="17" fill="#64748B">EDITABILITY</text>
    <line x1="36" y1="136" x2="1250" y2="136" stroke="#1263E6" stroke-width="5"/>
    <line x1="1250" y1="136" x2="1504" y2="136" stroke="#D7E5FF" stroke-width="5"/>

    <rect x="168" y="184" width="1280" height="82" rx="18" fill="#DCEAFF"/>
    <rect x="160" y="176" width="1280" height="82" rx="18" fill="#1263E6"/>
    <rect x="1240" y="176" width="200" height="82" rx="18" fill="#2C83F3"/>
    <circle cx="218" cy="217" r="25" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-width="2"/>
    <text x="218" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">⇢</text>
    <text x="260" y="228" font-size="31" font-weight="700" fill="#FFFFFF">原生对象 → Office SVG 降级 → 明确失败；没有“悄悄丢掉”</text>

    <rect x="104" y="322" width="424" height="400" rx="22" fill="#E5F0FF"/>
    <rect x="96" y="314" width="424" height="400" rx="22" fill="#FFFFFF" stroke="#BFD6FF" stroke-width="2"/>
    <rect x="96" y="314" width="424" height="92" rx="22" fill="#1263E6"/>
    <rect x="96" y="384" width="424" height="22" fill="#1263E6"/>
    <circle cx="154" cy="360" r="30" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="2"/>
    <text x="154" y="370" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="204" y="352" font-size="27" font-weight="700" fill="#FFFFFF">原生 PowerPoint</text>
    <text x="204" y="384" font-size="18" fill="#DCEAFF">优先路径 · 逐项可编辑</text>
    <text x="128" y="462" font-size="25" font-weight="700" fill="#173A73">文本与基础图形</text>
    <text x="128" y="502" font-size="20" fill="#334155">• text / tspan</text>
    <text x="128" y="536" font-size="20" fill="#334155">• rect / circle / ellipse / line</text>
    <text x="128" y="570" font-size="20" fill="#334155">• image / 基础 group</text>
    <line x1="128" y1="608" x2="488" y2="608" stroke="#D7E5FF" stroke-width="2"/>
    <text x="128" y="650" font-size="21" font-weight="700" fill="#1263E6">结果</text>
    <text x="190" y="650" font-size="18" fill="#334155">可搜索、可复制、可逐项修改</text>
    <rect x="128" y="674" width="360" height="20" rx="10" fill="#E7F0FF"/>
    <rect x="128" y="674" width="318" height="20" rx="10" fill="#1263E6"/>

    <rect x="596" y="322" width="424" height="400" rx="22" fill="#FFF2D8"/>
    <rect x="588" y="314" width="424" height="400" rx="22" fill="#FFFFFF" stroke="#FFD688" stroke-width="2"/>
    <rect x="588" y="314" width="424" height="92" rx="22" fill="#FFB21A"/>
