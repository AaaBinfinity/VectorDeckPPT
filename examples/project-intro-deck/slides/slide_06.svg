    <text x="646" y="370" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">△</text>
    <text x="696" y="352" font-size="30" font-weight="700" fill="#FFFFFF">Office SVG 降级</text>
    <text x="696" y="384" font-size="18" fill="#FFF7E8">保真路径 · 整体可编辑</text>
    <text x="620" y="462" font-size="25" font-weight="700" fill="#8B5B00">复杂视觉元素</text>
    <text x="620" y="502" font-size="20" fill="#334155">• path / polygon / polyline</text>
    <text x="620" y="536" font-size="20" fill="#334155">• 渐变 / 裁剪 / 旋转</text>
    <text x="620" y="570" font-size="20" fill="#334155">• 兼容 PNG + Office SVG 关系</text>
    <line x1="620" y1="608" x2="980" y2="608" stroke="#FFE1A8" stroke-width="2"/>
    <text x="620" y="650" font-size="21" font-weight="700" fill="#E99500">结果</text>
    <text x="682" y="650" font-size="18" fill="#334155">外观保留，内部路径不原生</text>
    <rect x="620" y="674" width="360" height="20" rx="10" fill="#FFF2D8"/>
    <rect x="620" y="674" width="230" height="20" rx="10" fill="#FFB21A"/>

    <rect x="1088" y="322" width="424" height="400" rx="22" fill="#FDE8EA"/>
    <rect x="1080" y="314" width="424" height="400" rx="22" fill="#FFFFFF" stroke="#F5B5BA" stroke-width="2"/>
    <rect x="1080" y="314" width="424" height="92" rx="22" fill="#EA3B42"/>
    <rect x="1080" y="384" width="424" height="22" fill="#EA3B42"/>
    <circle cx="1138" cy="360" r="30" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="2"/>
    <text x="1138" y="370" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">!</text>
    <text x="1188" y="352" font-size="30" font-weight="700" fill="#FFFFFF">明确失败</text>
    <text x="1188" y="384" font-size="18" fill="#FFE9EA">阻断路径 · 给出诊断</text>
    <text x="1112" y="462" font-size="25" font-weight="700" fill="#A52229">不可靠或不安全</text>
    <text x="1112" y="502" font-size="20" fill="#334155">• 禁止元素或远程资源</text>
    <text x="1112" y="536" font-size="20" fill="#334155">• 无法保真的可见内容</text>
    <text x="1112" y="570" font-size="20" fill="#334155">• 非法 PPTX 包关系</text>
    <line x1="1112" y1="608" x2="1472" y2="608" stroke="#FAD1D4" stroke-width="2"/>
    <text x="1112" y="650" font-size="21" font-weight="700" fill="#EA3B42">结果</text>
    <text x="1174" y="650" font-size="18" fill="#334155">不写出半成品，明确报错</text>
    <rect x="1112" y="674" width="360" height="20" rx="10" fill="#FDE8EA"/>
    <rect x="1112" y="674" width="88" height="20" rx="10" fill="#EA3B42"/>

    <rect x="96" y="762" width="1408" height="82" rx="18" fill="#EDF4FF" stroke="#C9DCFC" stroke-width="2"/>
    <circle cx="144" cy="803" r="26" fill="#1263E6"/>
    <text x="144" y="812" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">#</text>
    <text x="190" y="795" font-size="23" font-weight="700" fill="#173A73">编译报告始终记录 native、embedded_svg 与 failed。</text>
    <text x="190" y="825" font-size="18" fill="#64748B">只要 failed 不为 0，就不能进入交付</text>
    <text x="1452" y="812" text-anchor="end" font-size="18" fill="#94A3B8">06 / 10</text>
