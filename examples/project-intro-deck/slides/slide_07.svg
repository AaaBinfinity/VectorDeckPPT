<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#F4F1EA"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="96" y="118" font-size="54" font-weight="700" fill="#111827">质量不是“能打开”，而是可验证的闭环</text>
    <text x="96" y="166" font-size="22" fill="#6B7280">每一轮都把结构正确、视觉判断与 PowerPoint 实际表现放在同一条链路上。</text>

    <line x1="278" y1="330" x2="1322" y2="330" stroke="#155EEF" stroke-width="5"/>
    <line x1="1322" y1="330" x2="1322" y2="620" stroke="#155EEF" stroke-width="5"/>
    <line x1="1322" y1="620" x2="278" y2="620" stroke="#155EEF" stroke-width="5"/>
    <line x1="278" y1="620" x2="278" y2="330" stroke="#155EEF" stroke-width="5"/>

    <circle cx="278" cy="330" r="52" fill="#155EEF"/>
    <circle cx="626" cy="330" r="52" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>
    <circle cx="974" cy="330" r="52" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>
    <circle cx="1322" cy="330" r="52" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>
    <circle cx="1322" cy="620" r="52" fill="#B8F34A" stroke="#111827" stroke-width="4"/>
    <circle cx="800" cy="620" r="52" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>
    <circle cx="278" cy="620" r="52" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>

    <text x="278" y="340" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">01</text>
    <text x="626" y="340" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">02</text>
    <text x="974" y="340" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">03</text>
    <text x="1322" y="340" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">04</text>
    <text x="1322" y="630" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">05</text>
    <text x="800" y="630" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">06</text>
    <text x="278" y="630" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">07</text>

    <text x="278" y="246" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">校验 SVG</text>
    <text x="626" y="246" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">渲染 PNG</text>
    <text x="974" y="246" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">视觉复审</text>
    <text x="1322" y="246" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">修改源稿</text>
    <text x="1504" y="628" text-anchor="end" font-size="24" font-weight="700" fill="#111827">编译 PPTX</text>
    <text x="800" y="718" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">包结构验证</text>
    <text x="278" y="718" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">实际渲染检查</text>

    <text x="800" y="430" text-anchor="middle" font-size="74" font-weight="700" fill="#111827">看见结果</text>
    <text x="800" y="500" text-anchor="middle" font-size="28" fill="#6B7280">结构检查负责“正确”，视觉复审负责“可信”</text>
    <rect x="570" y="522" width="460" height="36" fill="#B8F34A"/>
    <text x="800" y="548" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">全部通过，才进入交付</text>

    <text x="1504" y="832" text-anchor="end" font-size="20" fill="#6B7280">07</text>
  </g>
</svg>
